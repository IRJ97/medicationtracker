<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Medication tracker</title><style>
*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f2f4f7;color:#17212b}main{max-width:650px;margin:auto;padding:16px}h1{font-size:26px}h2{font-size:21px;margin:0 0 10px}section{background:white;border-radius:16px;padding:16px;margin:12px 0}article{border-top:1px solid #ddd;padding:14px 0}button,input,select{font:inherit;min-height:44px;border-radius:8px;border:1px solid #aab4bf;padding:9px;max-width:100%}button{cursor:pointer}button.primary{background:#17664d;color:white;border:0;width:100%;font-weight:600;margin:8px 0}input[type=datetime-local]{width:100%;min-width:0}small{display:block;color:#536273;margin:5px 0} .due{color:#a52626;font-weight:700}.soon{color:#8c5900;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .row>*{flex:1}details{margin-top:8px}#notice{padding:12px;background:#fff0c7;border-radius:10px}label{display:block;margin:8px 0} @media(prefers-color-scheme:dark){body{background:#111827;color:#f3f4f6}section{background:#202b39}small{color:#c5cdd8}#notice{background:#513c12} .due{color:#ffabab}.soon{color:#ffd580}input,select,button{color-scheme:dark}}
 
:root{--surface:#fff;--muted:#5d6878;--line:#e1e6ed;--ink:#152332;--accent:#17664d;--soft:#eef3f6}body{background:#f4f6f9;color:var(--ink)}main{padding:20px 14px 36px}h1{margin:0;font-size:28px;letter-spacing:-.8px}header p{margin:5px 0 18px;font-size:14px;color:var(--muted)}#notice{background:none;color:var(--muted);font-size:12px;padding:4px 0 10px}section{padding:0 14px;margin:12px 0;border:1px solid var(--line);background:var(--surface);box-shadow:none}h2{padding:14px 0 11px;margin:0;font-size:21px}article{padding:12px 0;border-color:var(--line)}.medhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.medhead strong{font-size:16px}.interval{font-size:12px;color:var(--muted)}.dosegrid{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;margin-top:8px}.nextlabel{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}.duetime{font-size:24px;font-weight:750;line-height:1.2;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.dueday{font-size:12px;color:var(--muted)}.status{font-size:11px;font-weight:700;margin-top:4px;color:var(--muted)}.due{color:#b42318}.soon{color:#946000}.upcoming{color:#17664d}.last{font-size:12px;margin-top:7px;color:var(--muted)}button.primary{width:auto;margin:0;padding:10px 14px;white-space:nowrap;min-height:48px;border-radius:10px;font-size:14px}details{margin:8px 0 0}summary{font-size:13px;color:var(--muted);cursor:pointer;padding:5px 0}details[open]{padding-bottom:5px}#tools{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:22px}#tools button{margin:5px 0}#paste-import{width:100%}.notice-warn{color:#b42318!important;font-weight:700}.intro{color:var(--muted);font-size:12px;margin:10px 0}.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--surface:#1c2534;--muted:#aebacb;--line:#344153;--ink:#f0f4fa;--soft:#252f40}body{background:#101722}#notice{background:none}.due,.notice-warn{color:#ff9d99!important}.soon{color:#ffd080}.upcoming{color:#8ae1b7}button.primary{background:#167a55;color:white}} 
</style></head><body><main><header><h1>Medication tracker</h1><p>Last given · Next scheduled dose</p></header><div id="notice">Loading tracker…</div><div id="patients"></div><details id="tools"><summary>Settings &amp; backup</summary><button id="add">Add patient</button> <button id="backup">Export records</button> <label>Restore backup <input id="restore" type="file" accept=".json,application/json"></label><details id="paste-panel"><summary>Paste backup (no file needed)</summary><textarea id="paste-data" rows="5" placeholder="Paste copied backup here" style="width:100%;font:inherit;margin:10px 0;padding:10px;border-radius:8px"></textarea><button id="paste-import" class="primary">Import pasted records</button></details></details><p class="intro">Record only doses actually given. Confirm intervals and doses with the prescriber. No background reminders; use phone alarms.</p></main>
<script>
'use strict';
const key='medtracker-v1';let state={patients:[],records:[]};let storageOK=true;
try{const raw=localStorage.getItem(key);if(raw)state=JSON.parse(raw);localStorage.setItem(key,JSON.stringify(state));}catch(e){storageOK=false}
const root=document.getElementById('patients'),notice=document.getElementById('notice');
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch(e){storageOK=false;notice.textContent='Storage failed. Export records before closing.';return false}}
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function button(text,fn,cls){const b=el('button',text,cls);b.type='button';b.onclick=fn;return b}
function fmt(t){return new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function local(t){const d=new Date(t);return new Date(t-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function log(p,m,t){if(!Number.isFinite(t)||t>Date.now()){alert('Enter a valid past or current time.');return}if(state.records.some(r=>r.p===p.id&&r.m===m&&Math.abs(r.t-t)<60000)){alert('A dose at this time is already recorded.');return}if(!confirm('Record '+m+' for '+p.name+' at '+fmt(t)+'?'))return;state.records.push({id:Date.now()+'-'+Math.random(),p:p.id,m,t});save();render()}
function timeOnly(t){return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}
function dayOnly(t){const d=new Date(t),now=new Date();const tomorrow=new Date();tomorrow.setDate(now.getDate()+1);return d.toDateString()===now.toDateString()?'Today':d.toDateString()===tomorrow.toDateString()?'Tomorrow':d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:d.getFullYear()===now.getFullYear()?undefined:'numeric'})}
function refreshTimes(){document.querySelectorAll('[data-due]').forEach(x=>{const t=Number(x.dataset.due),diff=t-Date.now();x.querySelector('.dueday').textContent=dayOnly(t);const s=x.querySelector('.status');s.textContent=diff<=0?'DUE / CHECK':diff<=3600000?'DUE SOON':'UPCOMING';s.className='status '+(diff<=0?'due':diff<=3600000?'soon':'upcoming');x.querySelector('.duetime').className='duetime '+(diff<=0?'due':diff<=3600000?'soon':'')})}
function render(){
root.replaceChildren();notice.textContent=storageOK?'Saved on this device':'Storage unavailable — export records before closing';notice.className=storageOK?'':'notice-warn';
if(!state.patients.length){root.append(el('p','No patients yet. Add patients or restore your backup in Settings.','empty'));document.getElementById('tools').open=true}
for(const p of state.patients){
const card=el('section');card.append(el('h2',p.name));
for(const m of p.meds){
const a=el('article');const history=state.records.filter(r=>r.p===p.id&&r.m===m).sort((a,b)=>b.t-a.t),last=history[0];
const hours=m==='Kanadex'?8:m==='Panadol'?6:p.antibioticPhase==='daily'||history.length>=2?24:12;
const head=el('div',undefined,'medhead');head.append(el('strong',m),el('span',hours+' hourly','interval'));a.append(head);
const grid=el('div',undefined,'dosegrid'),next=el('div');next.append(el('div','Next dose','nextlabel'));
if(last){const due=last.t+hours*3600000;next.dataset.due=due;next.append(el('div',timeOnly(due),'duetime'),el('div',dayOnly(due),'dueday'),el('div','','status'))}
else{next.append(el('div','Not recorded','duetime'),el('div','Log first dose','dueday'))}
grid.append(next,button('Given now',()=>log(p,m,Date.now()),'primary'));a.append(grid);
a.append(el('small',last?'Last given: '+fmt(last.t):'Last given: —','last'));
const det=el('details');det.append(el('summary','Edit time / history'+(history.length?' ('+history.length+')':'')));
const input=el('input');input.type='datetime-local';input.value=local(Date.now());const label=el('label','Actual administration time');label.append(input);det.append(label,button('Save earlier dose',()=>log(p,m,new Date(input.value).getTime())));
if(m==='Antibiotic'){const lab=el('label','Antibiotic course: '),sel=el('select');for(const [v,t] of [['first','Initial 12h gap, then 24h'],['daily','Already on 24h interval']]){const o=el('option',t);o.value=v;sel.append(o)}sel.value=p.antibioticPhase||'first';sel.onchange=()=>{p.antibioticPhase=sel.value;save();render()};lab.append(sel);det.append(lab)}
for(const r of history){const row=el('div',undefined,'row');row.append(el('small',fmt(r.t)),button('Remove',()=>{if(confirm('Remove this record?')){state.records=state.records.filter(x=>x.id!==r.id);save();render()}}));det.append(row)}
a.append(det);card.append(a)
}root.append(card)
}refreshTimes()
}
document.getElementById('add').onclick=()=>{const name=prompt('Patient name');if(!name||!name.trim())return;const all=confirm('Track all three medicines? OK = Kanadex, antibiotic and Panadol; Cancel = Panadol only.');state.patients.push({id:String(Date.now()),name:name.trim(),meds:all?['Kanadex','Antibiotic','Panadol']:['Panadol'],antibioticPhase:'first'});save();render()};
document.getElementById('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));const a=el('a');a.href=url;a.download='medication-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function restoreText(raw){try{const v=JSON.parse(raw);if(!Array.isArray(v.patients)||!Array.isArray(v.records)||!v.patients.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.meds)&&p.meds.every(m=>['Kanadex','Antibiotic','Panadol'].includes(m)))||!v.records.every(r=>Number.isFinite(r.t)&&typeof r.id==='string'&&v.patients.some(p=>p.id===r.p&&p.meds.includes(r.m))))throw Error();if(confirm('Restore '+v.patients.length+' patients and '+v.records.length+' records? This replaces current local records.')){state=v;save();render();document.getElementById('paste-data').value='';document.getElementById('paste-panel').open=false;alert('Backup restored. Verify all medication times.')}}catch(e){alert('Invalid backup. Copy the complete backup text and try again.')}}
document.getElementById('restore').onchange=async e=>{try{if(e.target.files[0])restoreText(await e.target.files[0].text())}catch(e){alert('Unable to read file. Use Paste backup instead.')}};
document.getElementById('paste-import').onclick=()=>restoreText(document.getElementById('paste-data').value);
setInterval(refreshTimes,15000);render();
</script></body></html>
